<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackarena Konferenz</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-display:swap;src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2')}
:root{
  --bg:#0B0A0F;--panel:#14131A;--panel2:#1B1A22;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#F2F0EA;--muted:#9A98A3;--dim:#6E6C77;--ok:#6CCF8E;--bad:#F2545B;--warn:#F2C14E;--blue:#46BFE0;--violet:#8E92F8;
  --grad:linear-gradient(45deg,#F2C14E,#CAC561,#A2C974);
  --sys:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'JetBrains Mono',Menlo,monospace;
  --disp:'Bricolage Grotesque',var(--sys);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sys);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.disp{font-family:var(--disp);font-stretch:78%;font-weight:780;letter-spacing:-.01em;line-height:.95}

/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:0 16px;height:54px;border-bottom:1px solid var(--line);background:#0E0D13}
.brand{display:flex;align-items:center;gap:9px;font-size:22px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--grad)}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-weight:600;position:relative}
.tabs a.on{color:var(--ink)}
.tabs a.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--grad);border-radius:2px}
.teams{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.tchip{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tchip.on{color:var(--ink);border-color:var(--ink)}
.opt{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,84,91,.6)}70%{box-shadow:0 0 0 8px rgba(242,84,91,0)}100%{box-shadow:0 0 0 0 rgba(242,84,91,0)}}
.live-badge{font:700 10.5px var(--sys);letter-spacing:.06em;color:#fff;background:var(--bad);border-radius:4px;padding:2px 6px}
.done-badge{font:600 10.5px var(--sys);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.kind{font:600 11px var(--sys);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}

/* screens */
.screen{position:absolute;top:54px;left:0;right:0;bottom:38px;overflow:hidden}
.empty-screen{display:grid;place-items:center;height:100%;color:var(--muted)}
.grid{display:grid;gap:10px;padding:10px;height:100%}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.thead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.thead .name{font-size:24px}
.thead .stack{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.thead .clock{margin-left:auto;font:600 15px var(--mono);white-space:nowrap}
.thead .clock small{color:var(--muted);font-weight:400}
.tbody{flex:1;min-height:0;position:relative;container-type:size}
.tfoot{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfoot b{color:var(--ink);font-weight:600}

/* app tile */
.appview{position:absolute;inset:0;overflow:hidden;background:#fff}
.appview iframe{border:0;width:1280px;height:800px;transform-origin:top left;position:absolute;left:0;top:0}
.noapp{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;background:var(--panel)}
.board{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.score{display:flex;align-items:baseline;gap:12px}
.score .n{font-size:84px}
.score .of{font-size:40px;color:var(--muted)}
.score .lbl{color:var(--muted);font-size:14px}
.squares{display:flex;flex-wrap:wrap;gap:4px}
.squares i{width:14px;height:14px;border-radius:3px;background:var(--panel2)}
.squares i.ok{background:var(--ok)}.squares i.bad{background:var(--bad)}
.srv{display:flex;align-items:center;gap:8px;font-weight:600}
.srv.up{color:var(--ok)}.srv.down{color:var(--bad)}
.now{color:var(--ink);font-size:13px;border-left:2px solid var(--warn);padding-left:10px}
.now small{display:block;color:var(--muted)}
.steps{display:grid;gap:5px;color:var(--muted);font-size:13px}
.steps div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps time{font:11px var(--mono);color:var(--dim);margin-right:8px}
.parts{display:grid;gap:9px}
.part{display:grid;grid-template-columns:72px 64px minmax(0,1fr);align-items:baseline;gap:4px 10px}
.part b{font-size:24px}
.part small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{grid-column:1/-1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.info{color:var(--muted);font-size:12.5px}
.graded{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 28px}
.graded .score{flex-direction:column;align-items:flex-start;gap:6px}
.graded .parts{flex:1;min-width:240px}
/* Small tiles on the overview: score beside its parts, details only on the team page */
@container (max-height:150px){
  .board{padding:10px 14px;gap:8px}
  .graded{flex-wrap:nowrap;align-items:center;gap:22px}
  .graded .score .n{font-size:min(64px,70cqh)}
  .graded .score .lbl,.board .info,.board .now,.board .steps,.board .squares,.board .srv:not(.gerr),.meter{display:none}
  .graded .parts{display:flex;gap:18px;min-width:0}
  .part{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px}
  .part b{font-size:22px;color:var(--ink)}
  .part small{display:none}
}
td small.parts{display:block;color:var(--muted);font-size:12px;line-height:1.5}

/* feed */
.feed{position:absolute;inset:0;overflow-y:auto;padding:12px 14px 30px}
.ev{margin:0 0 8px}
.ev time{font:11px var(--mono);color:var(--dim);margin-right:6px}
.say{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 11px;white-space:pre-wrap;word-break:break-word}
.say code{font:12.5px var(--mono);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px}
.tool{border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.tool .row{display:flex;gap:8px;align-items:baseline;cursor:pointer;min-width:0}
.tool .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{font:600 10.5px var(--mono);color:var(--bg);background:var(--muted);border-radius:4px;padding:1px 5px;flex:none;text-transform:lowercase}
.tag.Bash{background:var(--blue)}.tag.Write,.tag.Edit,.tag.MultiEdit{background:var(--warn)}.tag.Read,.tag.Grep,.tag.Glob{background:var(--violet)}.tag.Task,.tag.Agent{background:#C39BF2}
.state{margin-left:auto;font-size:11.5px;color:var(--dim);flex:none}
.state.ok{color:var(--ok)}.state.err{color:var(--bad)}.state.run{color:var(--warn)}
pre{margin:6px 0 0;font:12px/1.45 var(--mono);color:#cfcdd6;background:#08070B;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
pre.err{border-color:rgba(242,84,91,.5)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sys{color:var(--warn);font-size:12.5px}
.end{border:1px solid var(--ok);border-radius:12px;padding:10px 12px;background:rgba(108,207,142,.08);white-space:pre-wrap}
.compact .say{font-size:13px;padding:6px 9px}
.compact pre.cmd{display:none}
.compact .ev{margin-bottom:6px}

/* table */
.tables{padding:16px 20px;overflow:auto;height:100%;display:grid;gap:22px;align-content:start}
.league h2{font-size:30px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.rank{font-size:26px;width:44px}
td.team a{font-size:22px}
td.team small{display:block;color:var(--muted);font-family:var(--sys);font-size:12px;font-weight:400;letter-spacing:0}
td.big{font-size:22px}
tr.lead td.rank{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.spark{display:block}
.ticker-list{display:grid;gap:6px}
.tick{display:flex;gap:10px;font-size:13.5px}
.tick time{font:12px var(--mono);color:var(--dim);flex:none;width:44px}
.tick b{font-weight:700}

/* team page */
.teampage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:10px;padding:10px;height:100%}
.teampage .ui{grid-row:1}
.teampage .stats{grid-row:2;grid-column:1}
.teampage .live{grid-row:1/span 2;grid-column:2}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px;padding:14px 16px}
.stat .v{font-size:40px}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.statbody{position:absolute;inset:0;overflow:auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.mini h3{font-size:12.5px;color:var(--muted);margin:6px 0;font-weight:600}
.tree{font:12px/1.55 var(--mono);color:#d4d2db}
.tree .d{color:var(--muted)}.tree .n{color:var(--dim);float:right}
.tree .neu{color:var(--ok)}.tree .geändert{color:var(--warn)}.tree .offen{color:var(--blue)}
.commit{display:flex;gap:8px;font-size:12.5px;margin:3px 0}
.commit code{font:12px var(--mono);color:var(--warn)}
.commit time{margin-left:auto;color:var(--dim);font:11.5px var(--mono);flex:none}

/* ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;height:38px;border-top:1px solid var(--line);background:#0E0D13;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:13.5px;overflow:hidden;white-space:nowrap}
.ticker .lbl{font:700 11px var(--sys);letter-spacing:.06em;color:var(--bg);background:var(--grad);border-radius:4px;padding:3px 7px}
.ticker .items{display:flex;gap:28px;overflow:hidden}
.ticker time{font:12px var(--mono);color:var(--dim);margin-right:6px}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:rgba(108,207,142,.35)}100%{background:transparent}}
</style>
</head>
<body>
<header class="top">
  <a class="brand disp" href="#/apps"><i></i>Stackarena</a>
  <nav class="tabs"><a href="#/apps" data-r="apps">Apps</a><a href="#/agents" data-r="agents">Agenten</a><a href="#/table" data-r="table">Tabelle</a></nav>
  <div class="teams" id="teams"></div>
  <label class="opt"><input type="checkbox" id="smoke"> Rauchtests</label>
</header>
<main id="screen" class="screen"></main>
<footer class="ticker"><span class="lbl">TICKER</span><div class="items" id="ticker"></div></footer>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hhmm = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const fmt = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)} Mio.` : n >= 1e3 ? `${Math.round(n / 1e3)} Tsd.` : String(n ?? 0));
const pct = (x) => (x == null ? '–' : `${Math.round(x * 100)} %`);
const num3 = (x) => x.toLocaleString('de-DE', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const PARTS = { api: 'API', contract: 'Contract', load: 'Last', e2e: 'E2E' };
const clockTime = (iso) => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

/* ---------- data: one entry per run, shared by all screens ---------- */
const runs = new Map();
let showSmoke = false;

function entry(r) {
  let e = runs.get(r.id);
  if (e) { Object.assign(e.meta, r); return e; }
  e = { id: r.id, meta: r, state: null, feed: makeFeed(r.id), app: null, last: '', prev: null };
  runs.set(r.id, e);
  return e;
}
const visible = () => [...runs.values()].filter((e) => showSmoke || !e.meta.smoke).sort((a, b) => (b.meta.live - a.meta.live) || a.meta.kind.localeCompare(b.meta.kind) || a.meta.name.localeCompare(b.meta.name));

let lineup = '';
async function loadRuns() {
  const list = await (await fetch('/api/runs')).json();
  for (const r of list) entry(r);
  // A run that starts or ends changes the line-up, so the screen is built again
  const now = visible().map((e) => `${e.id}:${e.meta.live}`).join(',');
  if (now !== lineup) { lineup = now; current = ''; }
  renderTeams();
  route();
}
// A round can take longer than the interval, so rounds never overlap
let polling = false;
async function refreshStates() {
  if (polling) return;
  polling = true;
  await Promise.all(visible().map(async (e) => {
    try {
      const s = await (await fetch(`/api/state?run=${e.id}`)).json();
      announce(e, s);
      e.prev = e.state;
      e.state = s;
    } catch {}
  }));
  polling = false;
  update();
  syncStreams();
}

/* ---------- ticker: commits, test runs, server up ---------- */
const ticks = [];
const seen = new Set();
function tick(at, html, key) {
  if (seen.has(key)) return;
  seen.add(key);
  ticks.push({ at: at ? Date.parse(at) : Date.now(), html });
  ticks.sort((a, b) => b.at - a.at);
}
function announce(e, s) {
  const who = `<b>${esc(s.name)}</b>`;
  for (const c of s.commits) tick(c.at, `${who} committet: ${esc(c.subject)}`, `c:${e.id}:${c.hash}`);
  if (s.tests) tick(s.tests.at, `${who}: ${s.tests.pass} von ${s.tests.pass + s.tests.fail} ${s.tests.suite}-Tests grün`, `t:${e.id}:${s.testRuns}`);
  if (s.server && e.state && e.state.server === false) tick(null, `${who}: Server läuft wieder`, `s:${e.id}:${Date.now()}`);
  if (e.state && s.tests && e.state.tests && s.tests.pass > e.state.tests.pass) e.flash = true;
}
function renderTicker() {
  $('#ticker').innerHTML = ticks.slice(0, 6).map((t) => `<span><time>${new Date(t.at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</time>${t.html}</span>`).join('');
}

/* ---------- feed: one DOM feed per run, moved between screens ---------- */
function makeFeed(id) {
  const el = document.createElement('div');
  el.className = 'feed';
  const tools = new Map();
  const stamp = (at) => (at ? `<time>${new Date(at).toLocaleTimeString('de-DE')}</time>` : '');
  const near = () => el.scrollHeight - el.scrollTop - el.clientHeight < 140;
  const feed = { el, plan: [], lastAction: '', quota: null, recent: [] };
  const note = (text, at) => { feed.lastAction = text; feed.recent.unshift({ text, at }); feed.recent.length = Math.min(feed.recent.length, 12); };
  function add(item, at) {
    const stick = near();
    let node = null;
    if (item.k === 'text') {
      node = document.createElement('div');
      node.className = 'ev';
      node.innerHTML = `${stamp(at)}<div class="say">${esc(item.text).replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`;
      note(item.text.split('\n')[0], at);
    } else if (item.k === 'tool') {
      node = document.createElement('div');
      node.className = 'ev tool';
      node.innerHTML = `<div class="row">${stamp(at)}<span class="tag ${esc(item.name)}">${esc(item.name)}</span><span class="t">${esc(item.title)}</span><span class="state run">läuft</span></div>${item.detail ? `<pre class="cmd clamp">${esc(item.detail)}</pre>` : ''}`;
      tools.set(item.id, node);
      note(item.title, at);
    } else if (item.k === 'result') {
      const t = tools.get(item.id);
      if (!t) return;
      const st = $('.state', t);
      st.className = `state ${item.error ? 'err' : 'ok'}`;
      st.textContent = item.error ? 'Fehler' : 'fertig';
      const pre = document.createElement('pre');
      pre.className = item.error ? 'err' : '';
      pre.textContent = item.text || '(keine Ausgabe)';
      pre.hidden = true;
      t.appendChild(pre);
      $('.row', t).addEventListener('click', () => { pre.hidden = !pre.hidden; $('.cmd', t)?.classList.toggle('clamp'); });
      return;
    } else if (item.k === 'plan') {
      feed.plan = item.todos;
      return;
    } else if (item.k === 'quota') {
      feed.quota = item;
      return;
    } else if (item.k === 'sys') {
      node = document.createElement('div');
      node.className = 'ev sys';
      node.innerHTML = `${stamp(at)}${esc(item.text)}`;
    } else if (item.k === 'end') {
      node = document.createElement('div');
      node.className = 'ev end';
      node.innerHTML = `<b>Lauf beendet</b> (${esc(item.outcome)})\n${esc(item.text)}`;
    }
    if (node) el.appendChild(node);
    if (stick) el.scrollTop = el.scrollHeight;
  }
  // A message from offset 0 carries the whole transcript, so the feed starts over with it
  Object.assign(feed, { offset: 0, loaded: false });
  feed.apply = ({ at, from, to, items }) => {
    if (from === 0) {
      el.replaceChildren();
      tools.clear();
      Object.assign(feed, { plan: [], lastAction: '', quota: null, recent: [] });
    }
    for (const it of items) add(it, at);
    feed.offset = to;
    if (at === null) { feed.loaded = true; el.scrollTop = el.scrollHeight; }
  };
  return feed;
}

// One stream for all feeds, as browsers allow only six connections per host. It covers the shown
// runs that are live or not loaded yet, and starts again with the byte offset of each feed
// whenever a run joins; finished runs simply stay quiet until then
const isLive = (e) => e.state?.live ?? e.meta.live;
function shown(e) {
  if (current === 'apps' || current === 'agents') return showSmoke || !e.meta.smoke;
  return current === `team/${e.id}`;
}
let stream = null;
let streamRuns = new Set();
function syncStreams() {
  const wanted = [...runs.values()].filter((e) => shown(e) && (isLive(e) || !e.feed.loaded));
  if (wanted.length ? wanted.every((e) => streamRuns.has(e.id)) : !stream) return;
  stream?.close();
  stream = null;
  streamRuns = new Set(wanted.map((e) => e.id));
  if (!wanted.length) return;
  stream = new EventSource(`/api/events?runs=${wanted.map((e) => `${e.id}:${e.feed.offset}`).join(',')}`);
  stream.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    runs.get(msg.run)?.feed.apply(msg);
  };
  // The browser would reconnect with the old offsets, so the page does it itself
  stream.onerror = () => {
    stream.close();
    stream = null;
    streamRuns = new Set();
    setTimeout(syncStreams, 3000);
  };
}

/* ---------- shared pieces ---------- */
function elapsed(e) {
  const s = e.state;
  if (!s) return { ms: 0, limit: 4 * 3600000 };
  return { ms: (s.ended ? Date.parse(s.ended) : Date.now()) - Date.parse(s.started), limit: s.limitHours * 3600000 };
}
function badge(e) {
  return e.meta.live ? '<span class="live-badge">LIVE</span>' : e.meta.done ? '<span class="done-badge">beendet</span>' : '<span class="done-badge">gestoppt</span>';
}
function head(e) {
  return `<div class="thead"><span class="name disp">${esc(e.meta.name)}</span><span class="kind">${e.meta.kind === 'client' ? 'Client' : 'Backend'}</span>${badge(e)}<span class="stack">${esc(e.meta.stack)}</span><span class="clock" data-clock="${e.id}"></span></div>`;
}
function tickClocks() {
  for (const el of document.querySelectorAll('[data-clock]')) {
    const e = runs.get(el.dataset.clock);
    if (!e) continue;
    const t = elapsed(e);
    el.innerHTML = `${hhmm(t.ms)} <small>/ ${hhmm(t.limit)}</small>`;
  }
}
function spark(series, w = 140, h = 34) {
  if (!series || series.length < 2) return '';
  const maxX = Math.max(...series.map((p) => p.m), 1), maxY = Math.max(...series.map((p) => p.usd), 0.01);
  const pts = series.map((p) => `${((p.m / maxX) * (w - 2) + 1).toFixed(1)},${(h - 1 - (p.usd / maxY) * (h - 2)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="sg" x1="0" y1="${h}" x2="${w}" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F2C14E"/><stop offset="1" stop-color="#A2C974"/></linearGradient></defs><polyline points="${pts}" fill="none" stroke="url(#sg)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

// The independent grading by grade.ts after the run: score, its parts and the info beside them
function gradeBoard(s) {
  const g = s.summary?.grade;
  if (!g) return s.grading ? '<div class="now">Wird bewertet …<small>mit dem letzten Commit, frischer Umgebung und unverändertem Harness</small></div>' : '';
  const parts = Object.entries(g.parts ?? {});
  const load = g.parts?.load;
  const info = [
    load?.p95Ms && `p95: ${['sync-delta', 'sync-full', 'login', 'health'].map((k) => `${k} ${Math.round(load.p95Ms[k])} ms`).join(' · ')}, ${Math.round(load.requestsPerSecond)} Anfragen/s (Info)`,
    g.cli && `CLI (Info): ${g.cli.passed}/${g.cli.passed + g.cli.failed}`,
  ].filter(Boolean);
  return `<div class="graded"><div class="score"><span class="n disp">${num3(g.score)}</span><span class="lbl">Score${parts.length ? `, Mittel aus ${parts.length} Teilnoten` : ''}<br>bewertet ${clockTime(g.started)} in ${g.minutes.toLocaleString('de-DE')} min</span></div>
    ${g.error ? `<div class="srv down gerr">${esc(g.error)}</div>` : ''}
    <div class="parts">${parts.map(([k, p]) => `<div class="part"><span>${PARTS[k] ?? esc(k)}</span><b class="disp">${num3(p.score)}</b><small>${p.error ? esc(p.error) : `${p.passed}/${p.passed + p.failed}${p.skipped ? `, ${p.skipped} übersprungen` : ''}`}</small><div class="meter"><i style="width:${p.score * 100}%"></i></div></div>`).join('')}</div></div>
    ${info.map((t) => `<div class="info">${t}</div>`).join('')}`;
}

// The live "picture" of a team: its web app for clients, the score board for backends
function appBody(e) {
  const s = e.state;
  if (!s) return '<div class="noapp">lädt …</div>';
  if (s.kind === 'client') {
    if (s.preview) return `<div class="appview"><iframe src="${s.preview}" data-preview="${s.preview}"></iframe></div>`;
    const graded = gradeBoard(s);
    if (graded) return `<div class="board" style="background:var(--panel)">${graded}</div>`;
    return `<div class="noapp">${s.live ? 'Noch kein Web-Build erreichbar.<br>Sobald der Agent ihn auf Port 5173 startet, erscheint die App hier.' : 'Der Lauf ist beendet. Die App lief im Container.'}</div>`;
  }
  const t = s.tests;
  const total = t ? t.pass + t.fail : 37;
  const sq = t && t.cases.length ? t.cases.map((c) => `<i class="${c.ok ? 'ok' : 'bad'}" title="${esc(c.name)}"></i>`).join('') : Array.from({ length: total }, (_, i) => `<i class="${t ? (i < t.pass ? 'ok' : 'bad') : ''}"></i>`).join('');
  const graded = gradeBoard(s);
  const own = `${t?.at ? `letzter Lauf ${clockTime(t.at)}` : 'noch kein Testlauf'}`;
  return `<div class="board">
    ${graded ? `${graded}<div class="info">Eigene API-Tests des Agenten: ${t ? t.pass : 0}/${total}, ${own}</div>` : `<div class="score"><span class="n disp ${e.flash ? 'flash' : ''}">${t ? t.pass : 0}</span><span class="of disp">/ ${total}</span><span class="lbl">API-Tests grün<br>${own}</span></div>`}
    <div class="squares">${sq}</div>
    <div class="srv ${s.server ? 'up' : 'down'}"><span class="dot" style="background:currentColor"></span>${s.server ? 'Server antwortet auf /health' : s.live ? 'Server antwortet noch nicht' : 'Lauf beendet'}</div>
    <div class="now">${esc(e.feed.lastAction || '…')}<small>gerade dabei</small></div>
    <div class="steps">${e.feed.recent.slice(1).map((r) => `<div>${r.at ? `<time>${new Date(r.at).toLocaleTimeString('de-DE')}</time>` : ''}${esc(r.text)}</div>`).join('')}</div></div>`;
}
function fitIframes(root = document) {
  for (const f of root.querySelectorAll('.appview iframe')) {
    const box = f.parentElement;
    const scale = Math.min(box.clientWidth / 1280, box.clientHeight / 800);
    f.style.transform = `scale(${scale})`;
  }
}
// Re-renders an app slot without reloading a running iframe
function setApp(slot, e) {
  const html = appBody(e);
  const current = slot.querySelector('iframe')?.dataset.preview;
  if (current && current === e.state?.preview) return;
  slot.innerHTML = html;
  fitIframes(slot);
}

/* ---------- screens ---------- */
function gridColumns(n) { return n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4; }
function screenApps(root) {
  const list = visible();
  if (!list.length) return (root.innerHTML = '<div class="empty-screen">Noch keine Läufe.</div>');
  const cols = gridColumns(list.length);
  root.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-auto-rows:minmax(0,1fr)">${list.map((e) => `<a class="tile" href="#/team/${e.id}">${head(e)}<div class="tbody" data-app="${e.id}"></div><div class="tfoot" data-foot="${e.id}"></div></a>`).join('')}</div>`;
  update();
}
function screenAgents(root) {
  const list = visible();
  if (!list.length) return (root.innerHTML = '<div class="empty-screen">Noch keine Läufe.</div>');
  root.innerHTML = `<div class="grid compact" style="grid-template-columns:repeat(${Math.min(list.length, 4)},minmax(0,1fr))">${list.map((e) => `<section class="tile">${head(e)}<div class="tbody" data-feed="${e.id}"></div><div class="tfoot" data-foot="${e.id}"></div></section>`).join('')}</div>`;
  for (const e of list) { const slot = root.querySelector(`[data-feed="${e.id}"]`); slot.appendChild(e.feed.el); e.feed.el.scrollTop = e.feed.el.scrollHeight; }
  update();
}
// Graded runs rank by their score, ahead of ungraded ones; on equal scores the lower list price
// wins, then the shorter time. The agent's own tests do not count, it picks how many it runs
function rankRows(list) {
  const graded = (e) => e.state?.summary?.grade?.score ?? -1;
  return list.sort((a, b) => graded(b) - graded(a) || (a.state?.usd ?? 0) - (b.state?.usd ?? 0) || elapsed(a).ms - elapsed(b).ms);
}
function screenTable(root) {
  const league = (kind, title) => {
    const list = rankRows(visible().filter((e) => e.meta.kind === kind));
    if (!list.length) return '';
    return `<section class="league"><h2 class="disp">${title}</h2><table><thead><tr><th>Platz</th><th>Team</th><th>Status</th><th>Zeit</th><th>Score</th><th>Teilnoten</th><th>Eigene Tests</th><th>Commits</th><th>Code-Zeilen</th><th>Anfragen</th><th>Output-Tokens</th><th>Listenpreis</th><th>Kostenverlauf</th></tr></thead><tbody>${list.map((e, i) => {
      const s = e.state ?? {};
      const t = s.tests;
      const g = s.summary?.grade;
      const parts = Object.entries(g?.parts ?? {}).map(([k, p]) => `${PARTS[k] ?? esc(k)} ${num3(p.score)}`).join('<br>');
      return `<tr class="${i === 0 ? 'lead' : ''}"><td class="rank disp">${i + 1}</td><td class="team"><a class="disp" href="#/team/${e.id}">${esc(e.meta.name)}</a><small>${esc(e.meta.stack)}</small></td><td>${badge(e)}</td><td data-clock="${e.id}"></td><td class="big disp">${g ? num3(g.score) : s.grading ? '…' : '–'}</td><td><small class="parts">${parts || esc(g?.error ?? '')}</small></td><td class="big disp">${t ? `${t.pass}/${t.pass + t.fail}` : '–'}</td><td>${s.commits?.length ?? 0}</td><td>${fmt(s.code ?? 0)}</td><td>${s.requests ?? 0}</td><td>${fmt(s.tokens?.output ?? 0)}</td><td class="big disp">${(s.usd ?? 0).toFixed(2)} $</td><td>${spark(s.series)}</td></tr>`;
    }).join('')}</tbody></table></section>`;
  };
  root.innerHTML = `<div class="tables">${league('client', 'Client-Liga')}${league('backend', 'Backend-Liga')}<section class="league"><h2 class="disp">Ticker</h2><div class="ticker-list">${ticks.slice(0, 40).map((t) => `<div class="tick"><time>${new Date(t.at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</time><span>${t.html}</span></div>`).join('') || '<p class="tick">Noch nichts passiert.</p>'}</div></section></div>`;
  tickClocks();
}
function screenTeam(root, id) {
  const e = runs.get(id);
  if (!e) return (root.innerHTML = '<div class="empty-screen">Unbekannter Lauf.</div>');
  root.innerHTML = `<div class="teampage">
    <section class="tile ui">${head(e)}<div class="tbody" data-app="${e.id}"></div></section>
    <section class="tile stats"><div class="tbody"><div class="statbody" data-stats="${e.id}"></div></div></section>
    <section class="tile live"><div class="thead"><span class="name disp">Live</span><span class="stack">was der Agent sagt und tut</span></div><div class="tbody" data-feed="${e.id}"></div></section></div>`;
  root.querySelector(`[data-feed="${e.id}"]`).appendChild(e.feed.el);
  e.feed.el.scrollTop = e.feed.el.scrollHeight;
  update();
}
function statsBody(e) {
  const s = e.state;
  if (!s) return '';
  const q = e.feed.quota ?? s.quota;
  const t = s.tests;
  const plan = e.feed.plan.length ? `<div class="mini"><h3>Plan des Agenten</h3>${e.feed.plan.map((p) => `<div class="commit"><span>${p.status === 'completed' ? '✓' : p.status === 'in_progress' ? '▸' : '·'}</span><span>${esc(p.content)}</span></div>`).join('')}</div>` : '';
  const tree = (files) => {
    const root = {};
    for (const f of files) { let n = root; const parts = f.path.split('/'); parts.forEach((p, i) => { n = n[p] ??= i === parts.length - 1 ? { __f: f } : {}; }); }
    const walk = (n, d) => Object.keys(n).sort((a, b) => (!!n[a].__f - !!n[b].__f) || a.localeCompare(b)).map((k) => n[k].__f ? `<div class="${esc(n[k].__f.status)}">${'&nbsp;'.repeat(d * 2)}${esc(k)}<span class="n">${n[k].__f.lines || ''}</span></div>` : `<div class="d">${'&nbsp;'.repeat(d * 2)}${esc(k)}/</div>${walk(n[k], d + 1)}`).join('');
    return files.length ? walk(root, 0) : '<span class="muted">noch keine Dateien</span>';
  };
  return `<div class="statgrid">
      <div class="stat"><div class="v disp">${t ? `${t.pass}/${t.pass + t.fail}` : '–'}</div><div class="l">Eigene Tests (${t?.suite ?? '–'})</div></div>
      <div class="stat"><div class="v disp">${s.usd.toFixed(2)} $</div><div class="l">Listenpreis</div></div>
      <div class="stat"><div class="v disp">${s.commits.length}</div><div class="l">Commits</div></div>
      <div class="stat"><div class="v disp">${fmt(s.code)}</div><div class="l">Code-Zeilen</div></div>
      <div class="stat"><div class="v disp">${s.requests}</div><div class="l">Anfragen</div></div>
      <div class="stat"><div class="v disp">${fmt(s.tokens.output)}</div><div class="l">Output-Tokens</div></div>
      <div class="stat"><div class="v disp">${pct(q?.fiveHour)}</div><div class="l">Abo, 5-Stunden-Fenster</div></div>
      <div class="stat"><div class="v disp">${pct(q?.week)}</div><div class="l">Abo, Woche</div></div>
    </div>
    <div class="cols2"><div class="mini"><h3>Kostenverlauf</h3>${spark(s.series, 260, 60)}${plan}<h3>Commits</h3>${s.commits.map((c) => `<div class="commit"><code>${esc(c.hash)}</code><span>${esc(c.subject)}</span><time>${clockTime(c.at)}</time></div>`).join('') || '<span class="muted">noch keine</span>'}</div>
    <div class="mini"><h3>Dateien im Team-Ordner</h3><div class="tree">${tree(s.files)}</div></div></div>`;
}

/* ---------- updates without rebuilding screens ---------- */
function update() {
  for (const slot of document.querySelectorAll('[data-app]')) { const e = runs.get(slot.dataset.app); if (e) setApp(slot, e); }
  for (const slot of document.querySelectorAll('[data-stats]')) { const e = runs.get(slot.dataset.stats); if (e?.state) slot.innerHTML = statsBody(e); }
  for (const slot of document.querySelectorAll('[data-foot]')) {
    const e = runs.get(slot.dataset.foot);
    const s = e?.state;
    if (s) slot.innerHTML = `<b>${s.usd.toFixed(2)} $</b> · ${s.requests} Anfragen · ${s.commits.length} Commits · ${fmt(s.code)} Zeilen · <span>${esc(e.feed.lastAction)}</span>`;
  }
  for (const e of runs.values()) e.flash = false;
  if (current === 'table') screenTable($('#screen'));
  renderTicker();
  tickClocks();
}
function renderTeams() {
  $('#teams').innerHTML = visible().map((e) => `<a class="tchip ${current === `team/${e.id}` ? 'on' : ''}" href="#/team/${e.id}"><span class="dot ${e.meta.live ? 'live' : ''}"></span>${esc(e.meta.name)} <span style="color:var(--dim)">${e.meta.kind === 'client' ? 'Client' : 'Backend'}${e.meta.smoke ? ', Rauchtest' : ''}</span></a>`).join('');
}

let current = '';
function route() {
  const hash = location.hash.replace(/^#\//, '') || 'apps';
  const root = $('#screen');
  if (hash !== current) {
    current = hash;
    for (const a of document.querySelectorAll('.tabs a')) a.classList.toggle('on', a.dataset.r === hash);
    if (hash === 'apps') screenApps(root);
    else if (hash === 'agents') screenAgents(root);
    else if (hash === 'table') screenTable(root);
    else if (hash.startsWith('team/')) screenTeam(root, hash.slice(5));
    renderTeams();
  }
  syncStreams();
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => fitIframes());
$('#smoke').addEventListener('change', (ev) => { showSmoke = ev.target.checked; current = ''; renderTeams(); route(); refreshStates(); });

loadRuns().then(refreshStates);
setInterval(refreshStates, 5000);
setInterval(loadRuns, 30000);
setInterval(tickClocks, 1000);
</script>
</body>
</html>
