<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackarena live</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0E0D12;--panel:#15141A;--panel2:#1C1B22;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#F2F0EA;--muted:#9A98A3;--dim:#6E6C77;--ok:#6CCF8E;--bad:#F2545B;--warn:#F2C14E;--blue:#46BFE0;--violet:#8E92F8;
  --grad:linear-gradient(45deg,#F2C14E,#CAC561,#A2C974);
  --sys:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sys);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);height:52px}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.top h1 i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--grad);margin-right:8px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{color:var(--ink);border-color:var(--ink);background:var(--panel2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 rgba(108,207,142,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(108,207,142,0)}100%{box-shadow:0 0 0 0 rgba(108,207,142,0)}}
.hint{color:var(--dim);font-size:12px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:calc(100% - 52px)}
.col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.head{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.title{display:flex;align-items:baseline;gap:10px}
.title b{font-size:20px;letter-spacing:-.01em}
.title span{color:var(--muted);font-size:12.5px}
.clock{margin-left:auto;font:600 15px var(--mono);color:var(--ink)}
.clock small{color:var(--muted);font-weight:400}
.bar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);transition:width 1s linear}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stats .warn b{color:var(--warn)}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.multi .split{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}
.feed{overflow-y:auto;padding:12px 14px 40px;border-right:1px solid var(--line)}
.multi .feed{border-right:0;border-bottom:1px solid var(--line)}
.side{overflow-y:auto;padding:12px 14px 30px;display:grid;gap:12px;align-content:start}
.ev{margin:0 0 8px}
.ev time{font:11px var(--mono);color:var(--dim);margin-right:6px}
.say{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:9px 12px;white-space:pre-wrap;word-break:break-word}
.say code{font:12.5px var(--mono);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px}
.tool{border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.tool .row{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.tag{font:600 10.5px var(--mono);color:var(--bg);background:var(--muted);border-radius:4px;padding:1px 5px;flex:none;text-transform:lowercase}
.tag.Bash{background:var(--blue)}.tag.Write,.tag.Edit,.tag.MultiEdit{background:var(--warn)}.tag.Read,.tag.Grep,.tag.Glob{background:var(--violet)}.tag.Task,.tag.Agent{background:#C39BF2}
.tool .t{color:var(--ink)}
.state{margin-left:auto;font-size:11.5px;color:var(--dim);flex:none}
.state.ok{color:var(--ok)}.state.err{color:var(--bad)}.state.run{color:var(--warn)}
pre{margin:6px 0 0;font:12px/1.45 var(--mono);color:#cfcdd6;background:#0A090D;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
pre.cmd{color:#e6f6ff}
pre.err{border-color:rgba(242,84,91,.5)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sys{color:var(--warn);font-size:12.5px}
.end{border:1px solid var(--ok);border-radius:12px;padding:10px 12px;background:rgba(108,207,142,.08);white-space:pre-wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card h2{font-size:12.5px;color:var(--muted);margin:0 0 8px;font-weight:600}
.todo{display:flex;gap:8px;font-size:13px;margin:3px 0}
.todo i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);flex:none;margin-top:2px}
.todo.completed{color:var(--muted);text-decoration:line-through}.todo.completed i{background:var(--ok);border-color:var(--ok)}
.todo.in_progress i{border-color:var(--warn);background:rgba(242,193,78,.3)}
.preview{width:100%;height:520px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.big{font:700 28px var(--sys);letter-spacing:-.02em}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tree{font:12.5px/1.55 var(--mono);color:#d4d2db}
.tree .d{color:var(--muted)}
.tree .n{color:var(--dim);float:right}
.tree .neu{color:var(--ok)}.tree .geändert{color:var(--warn)}.tree .offen{color:var(--blue)}
.commit{display:flex;gap:8px;font-size:13px;margin:3px 0}
.commit code{font:12px var(--mono);color:var(--warn)}
.commit time{margin-left:auto;color:var(--dim);font:11.5px var(--mono);flex:none}
.empty{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header class="top"><h1><i></i>Stackarena live</h1><div class="chips" id="chips"></div><span class="hint">Klick wählt Läufe, zwei nebeneinander</span></header>
<main class="cols" id="cols"></main>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hhmm = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const fmt = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)} Mio.` : n >= 1e3 ? `${Math.round(n / 1e3)} Tsd.` : String(n);
const pct = (x) => x == null ? '–' : `${Math.round(x * 100)} %`;
const teamName = (id) => id.replace(/^smoke-/, 'Rauchtest ').replace(/^(client|backend)-/, (m, k) => (k === 'client' ? 'Client ' : 'Backend ')).replace(/-(\d+)$/, ', Lauf $1');

let selected = new URLSearchParams(location.search).get('runs')?.split(',').filter(Boolean) ?? [];
const views = new Map();

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  if (!selected.length) selected = runs.filter((r) => r.live).map((r) => r.id).slice(0, 2);
  if (!selected.length && runs[0]) selected = [runs[0].id];
  $('#chips').innerHTML = runs.map((r) => `<button class="chip ${selected.includes(r.id) ? 'on' : ''}" data-id="${r.id}"><span class="dot ${r.live ? 'live' : ''}"></span>${esc(teamName(r.id))}</button>`).join('');
  syncColumns();
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const id = chip.dataset.id;
    selected = selected.includes(id) ? selected.filter((x) => x !== id) : [...selected, id].slice(-2);
    history.replaceState(null, '', `?runs=${selected.join(',')}`);
    loadRuns();
    return;
  }
  const row = e.target.closest('.tool .row');
  if (row) row.parentElement.classList.toggle('open');
});

function syncColumns() {
  for (const [id, v] of views) if (!selected.includes(id)) { v.close(); views.delete(id); }
  for (const id of selected) if (!views.has(id)) views.set(id, openView(id));
  const cols = $('#cols');
  cols.classList.toggle('multi', selected.length > 1);
  for (const id of selected) cols.appendChild(views.get(id).el);
}

function openView(id) {
  const el = document.createElement('section');
  el.className = 'col';
  el.innerHTML = `<div class="head"><div class="title"><b>${esc(teamName(id))}</b><span class="what"></span><span class="clock"></span></div><div class="bar"><i></i></div><div class="stats"></div></div>
    <div class="split"><div class="feed"></div><div class="side"><div class="card plan" hidden><h2>Plan des Agenten</h2><div class="todos"></div></div><div class="card live"></div><div class="card"><h2>Dateien im Team-Ordner</h2><div class="tree"></div></div><div class="card"><h2>Commits</h2><div class="commits"></div></div></div></div>`;
  const feed = $('.feed', el);
  const tools = new Map();
  let lastTest = null;
  let state = null;

  const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  const stamp = (at) => (at ? `<time>${new Date(at).toLocaleTimeString('de-DE')}</time>` : '');
  function add(item, at) {
    const stick = nearBottom();
    let node;
    if (item.k === 'text') {
      node = document.createElement('div');
      node.className = 'ev';
      node.innerHTML = `${stamp(at)}<div class="say">${esc(item.text).replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`;
    } else if (item.k === 'tool') {
      node = document.createElement('div');
      node.className = 'ev tool';
      node.innerHTML = `<div class="row">${stamp(at)}<span class="tag ${esc(item.name)}">${esc(item.name)}</span><span class="t">${esc(item.title)}</span><span class="state run">läuft</span></div>${item.detail ? `<pre class="cmd clamp">${esc(item.detail)}</pre>` : ''}`;
      tools.set(item.id, node);
    } else if (item.k === 'result') {
      const t = tools.get(item.id);
      const m = /(\d+) pass[\s\S]*?(\d+) fail/.exec(item.text) || /(\d+) passed/.exec(item.text);
      if (m) { lastTest = { pass: +m[1], fail: m[2] ? +m[2] : 0, at: at ?? null }; renderLive(); }
      if (t) {
        const st = $('.state', t);
        st.className = `state ${item.error ? 'err' : 'ok'}`;
        st.textContent = item.error ? 'Fehler' : 'fertig';
        const pre = document.createElement('pre');
        pre.className = `out ${item.error ? 'err' : ''}`;
        pre.textContent = item.text || '(keine Ausgabe)';
        pre.hidden = !item.error;
        t.appendChild(pre);
        $('.row', t).addEventListener('click', () => { pre.hidden = !pre.hidden; $('.cmd', t)?.classList.toggle('clamp'); });
      }
      return;
    } else if (item.k === 'plan') {
      $('.plan', el).hidden = false;
      $('.todos', el).innerHTML = item.todos.map((t) => `<div class="todo ${esc(t.status)}"><i></i><span>${esc(t.status === 'in_progress' ? t.activeForm || t.content : t.content)}</span></div>`).join('');
      return;
    } else if (item.k === 'quota') {
      el._quota = item;
      return;
    } else if (item.k === 'sys') {
      node = document.createElement('div');
      node.className = 'ev sys';
      node.innerHTML = `${stamp(at)}${esc(item.text)}`;
    } else if (item.k === 'end') {
      node = document.createElement('div');
      node.className = 'ev end';
      node.innerHTML = `<b>Lauf beendet</b> (${esc(item.outcome)})\n${esc(item.text)}`;
    }
    if (node) feed.appendChild(node);
    if (stick) feed.scrollTop = feed.scrollHeight;
  }

  const source = new EventSource(`/api/events?run=${id}`);
  source.onmessage = (m) => {
    const { at, items } = JSON.parse(m.data);
    for (const it of items) add(it, at);
    if (at === null) feed.scrollTop = feed.scrollHeight;
  };

  function renderLive() {
    if (!state) return;
    const card = $('.card.live', el);
    let html = '';
    if (state.kind === 'client') {
      html = state.preview ? `<h2>App im Container (Web-Build auf Port 5173)</h2><iframe class="preview" src="${state.preview}"></iframe>` : `<h2>App</h2><p class="empty">Noch kein Web-Build auf Port 5173 erreichbar.</p>`;
    } else {
      html = `<h2>Server im Container</h2><div class="big ${state.server ? 'ok' : 'bad'}">${state.server ? 'läuft' : state.live ? 'noch nicht erreichbar' : 'gestoppt'}</div>`;
    }
    if (lastTest) html += `<h2 style="margin-top:12px">Letzter Testlauf des Agenten</h2><div class="big"><span class="ok">${lastTest.pass} bestanden</span>${lastTest.fail ? ` <span class="bad">${lastTest.fail} fehlgeschlagen</span>` : ''}</div>`;
    if (card.innerHTML !== html && !(state.preview && card.querySelector('iframe')?.src === state.preview && !lastTest)) card.innerHTML = html;
  }

  function tree(files) {
    if (!files.length) return '<p class="empty">Noch keine Dateien.</p>';
    const root = {};
    for (const f of files) {
      let node = root;
      const parts = f.path.split('/');
      parts.forEach((p, i) => { node = node[p] ??= i === parts.length - 1 ? { __file: f } : {}; });
    }
    const walk = (node, depth) => Object.keys(node).sort((a, b) => (!!node[a].__file - !!node[b].__file) || a.localeCompare(b)).map((k) => {
      const v = node[k];
      const pad = '&nbsp;'.repeat(depth * 2);
      if (v.__file) return `<div class="${esc(v.__file.status)}">${pad}${esc(k)}<span class="n">${v.__file.lines || ''}</span></div>`;
      return `<div class="d">${pad}${esc(k)}/</div>${walk(v, depth + 1)}`;
    }).join('');
    return walk(root, 0);
  }

  async function refresh() {
    try { state = await (await fetch(`/api/state?run=${id}`)).json(); } catch { return; }
    const started = Date.parse(state.started);
    const limit = state.limitHours * 3600000;
    const elapsed = state.summary ? state.summary.minutes * 60000 : Date.now() - started;
    $('.what', el).textContent = state.live ? 'läuft' : state.summary ? `beendet: ${state.summary.outcome}` : 'gestoppt';
    $('.clock', el).innerHTML = `${hhmm(elapsed)} <small>/ ${hhmm(limit)}</small>`;
    $('.bar i', el).style.width = `${Math.min(100, (elapsed / limit) * 100)}%`;
    const q = el._quota ?? state.quota;
    const t = state.tokens;
    $('.stats', el).innerHTML = `<span>Anfragen <b>${state.requests}</b></span><span>Listenpreis <b>${state.usd.toFixed(2)} $</b></span><span>Output <b>${fmt(t.output)}</b></span><span>Cache gelesen <b>${fmt(t.cacheRead)}</b></span><span>Commits <b>${state.commits.length}</b></span><span class="${q && q.fiveHour > 0.8 ? 'warn' : ''}">Abo 5 h <b>${pct(q?.fiveHour)}</b></span><span class="${q && q.week > 0.8 ? 'warn' : ''}">Abo Woche <b>${pct(q?.week)}</b></span>`;
    $('.tree', el).innerHTML = tree(state.files);
    $('.commits', el).innerHTML = state.commits.length ? state.commits.map((c) => `<div class="commit"><code>${esc(c.hash)}</code><span>${esc(c.subject)}</span><time>${new Date(c.at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</time></div>`).join('') : '<p class="empty">Noch keine Commits.</p>';
    renderLive();
  }
  refresh();
  const timer = setInterval(refresh, 5000);
  return { el, close() { source.close(); clearInterval(timer); el.remove(); } };
}

loadRuns();
setInterval(loadRuns, 30000);
</script>
</body>
</html>
