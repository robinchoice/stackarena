<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackarena: habit tracker mockup</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-display:swap;src:url(bricolage-grotesque-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-display:swap;src:url(bricolage-grotesque-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --sys:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --disp:'Bricolage Grotesque',var(--sys);
  --grad:linear-gradient(45deg,#F2C14E,#CAC561,#A2C974);
  --spectrum:linear-gradient(90deg,#f2545b,#fb8c45,#f2c14e,#6ccf8e,#46bfe0,#8e92f8,#c39bf2);
  --pin:#FF5FD2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#08070B;color:#B9B7C0;font-family:var(--sys);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.35}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #46BFE0;outline-offset:2px}
.spacer{flex:1}
[hidden]{display:none!important}

/* ---------- Workshop chrome ---------- */
.ws-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;background:rgba(8,7,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1d1b24}
.ws-title{color:#F2F0EA;font-weight:600;margin-right:auto;display:flex;gap:10px;align-items:center}
.ws-title small{font-weight:400;color:#7d7a87}
.ws-seg{display:inline-flex;background:#111017;border:1px solid #24222c;border-radius:10px;padding:3px;gap:2px}
.ws-seg button{padding:5px 11px;border-radius:7px;font-size:13px;color:#9A98A3;white-space:nowrap}
.ws-seg button:hover{color:#F2F0EA}
.ws-seg button.on{background:#26242f;color:#F2F0EA}
.ws-tg{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.ws-tg input{accent-color:#CAC561}
.ws-btn{padding:6px 11px;border:1px solid #2b2934;border-radius:9px;font-size:13px;color:#d6d4dc}
.ws-btn:hover{border-color:#45424f}
.ws-intro{max-width:1480px;margin:18px auto 0;padding:0 20px}
.ws-card{display:grid;grid-template-columns:minmax(240px,1.1fr) .8fr .8fr 1.7fr;gap:26px;background:#0f0e14;border:1px solid #1f1d27;border-radius:16px;padding:18px 22px}
.ws-card h1{font-family:var(--disp);font-stretch:78%;font-weight:780;font-size:30px;line-height:1;color:#F2F0EA;margin:0 0 8px;letter-spacing:-.01em}
.ws-card h1 .rec{font-family:var(--sys);font-stretch:100%;font-size:12px;font-weight:600;color:#17171A;background:var(--grad);border-radius:999px;padding:2px 9px;vertical-align:middle;margin-left:8px;letter-spacing:0}
.ws-card p{margin:0;font-size:14px}
.ws-card h4{font-size:13px;color:#F2F0EA;margin:0 0 8px;font-weight:600}
.ws-card ul{margin:0;padding-left:17px;display:grid;gap:4px;font-size:13.5px}
.ws-notes{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:13.5px}
.ws-notes li{display:flex;gap:9px;align-items:flex-start}
.ws-notes li.dir b{color:#F2F0EA;font-weight:600}
.ws-notes .pin{position:static;flex:none;margin-top:1px}
.ws-stage{max-width:1480px;margin:18px auto 56px;padding:0 20px}
.desk-wrap{position:relative;overflow:hidden}
.scaler{transform-origin:top left;width:1282px}
.frame{width:1282px;height:802px;border:1px solid #26242e;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.phones{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone-cap{font-size:12.5px;color:#7d7a87}
.ws-foot{max-width:1480px;margin:-36px auto 40px;padding:0 20px;color:#6c6977;font-size:12.5px}

/* Pins (workshop notes) */
.pr{position:relative}
.pin{position:absolute;top:-9px;left:-9px;z-index:30;width:19px;height:19px;border-radius:50%;background:var(--pin);color:#1a0716;font:700 11px/19px var(--sys);text-align:center;box-shadow:0 0 0 3px rgba(255,95,210,.22),0 4px 10px rgba(0,0,0,.45);pointer-events:none;font-stretch:100%;letter-spacing:0}
body.no-pins .stage .pin{display:none}

/* Test-ID overlay */
body.tids .stage [data-testid]{outline:1.5px dashed #46BFE0;outline-offset:1px}
body.tids .stage [data-testid]:hover::after{content:attr(data-testid);position:absolute;z-index:60;left:0;top:-22px;white-space:nowrap;background:#46BFE0;color:#06222b;font:600 11px/1 ui-monospace,monospace;padding:4px 6px;border-radius:5px;pointer-events:none}
body.tids .stage button[data-testid],body.tids .stage div[data-testid],body.tids .stage span[data-testid]{position:relative}

/* ---------- App themes ---------- */
.t-dark{--bg:#0E0D12;--surface:#16151B;--surface2:#1E1D24;--ink:#F2F0EA;--muted:#9A98A3;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--field:rgba(255,255,255,.34);--accent:#CAC561;--empty:rgba(255,255,255,.07);--overlay:rgba(4,3,7,.62);--veil:rgb(0 0 0/.55);--onhc:#17171A;color-scheme:dark}
.t-light{--bg:#F4F4F1;--surface:#FFFFFF;--surface2:#EAEAE5;--ink:#17171A;--muted:#5E5E66;--line:rgba(23,23,26,.10);--line2:rgba(23,23,26,.2);--field:rgba(23,23,26,.45);--accent:#67631A;--empty:rgba(23,23,26,.075);--overlay:rgba(23,23,26,.34);--veil:rgb(255 255 255/.6);--onhc:#FFFFFF;color-scheme:light}
.app,.ph{background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:14px;line-height:1.4}
.disp{font-family:var(--disp);font-stretch:78%;font-weight:780;letter-spacing:-.01em;line-height:.95}
.muted{color:var(--muted)}

/* shared bits */
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-size:26px;color:var(--ink)}
.sign{display:block;flex:none}
.ic{display:block;flex:none}
.chip{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--hc);background:color-mix(in srgb,var(--hc) 15%,transparent)}
.chip.lg{width:56px;height:56px;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--grad);color:#17171A}
.btn.sec{border:1px solid var(--line2);color:var(--ink)}
.btn.sec:hover{border-color:var(--field)}
.btn.ghost{color:var(--muted)}
.btn.danger{color:color-mix(in srgb,#F2545B 80%,var(--ink))}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.icbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.icbtn:hover{color:var(--ink);background:var(--empty)}
.icbtn.sm{width:30px;height:30px;border-radius:9px}
.icbtn.pri{background:var(--grad);color:#17171A}
.icbtn.pri:hover{background:var(--grad);color:#17171A}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:9px;text-align:left}
.sync:hover{background:var(--empty)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sync.off .dot{background:none;border:1.5px solid var(--muted)}
.sync.off{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--grad);transition:width .3s}
.prog{font-size:14px;color:var(--muted);margin:14px 0 8px}
.prog b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--empty);gap:2px}
.seg button{padding:6px 13px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.t-dark .seg button.on{background:#2A2931}
.grp-h{font-size:13px;font-weight:600;color:var(--muted);margin:28px 0 6px}

/* list rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:2px 0;border-radius:10px}
.row-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-name{font-size:15.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.row-meta span{display:inline-flex;align-items:center;gap:4px}
.row.nd .row-name{color:var(--muted)}
.row.nd .chip{filter:saturate(.35);opacity:.75}
.nd-next{font-size:12.5px;color:var(--muted);white-space:nowrap}
.segs{display:flex;gap:3px;margin-top:3px}
.segs i{width:14px;height:4px;border-radius:2px;background:var(--empty)}
.segs i.on{background:var(--hc)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--field);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--hc)}
.check.on{background:var(--hc);border-color:var(--hc);color:var(--onhc)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stp{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);color:var(--ink)}
.stp:hover:not(:disabled){border-color:var(--hc,var(--field))}
.stp.plus{background:color-mix(in srgb,var(--hc) 18%,transparent);border-color:color-mix(in srgb,var(--hc) 60%,transparent)}
.cnt{min-width:46px;text-align:center;font-size:13px;color:var(--muted)}
.cnt b{font-family:var(--disp);font-stretch:78%;font-weight:780;font-size:22px;color:var(--ink)}
.bump .check.on,.bump .cnt b{animation:bump .32s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* cards, detail */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:16px}
.t-light .card{border-color:transparent;box-shadow:0 1px 2px rgba(23,23,26,.06)}
.card-h{font-size:14px;font-weight:600;margin:0 0 14px;color:var(--ink)}
.card-hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-hrow .card-h{margin:0}
.main-in>.detail{max-width:820px}
.d-head{display:flex;align-items:center;gap:16px}
.d-name{font-size:40px;margin:0 0 6px}
.d-act{margin-left:auto;display:flex;gap:8px}
.d-today{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:12px 16px;border-radius:14px;background:var(--surface)}
.t-light .d-today{box-shadow:0 1px 2px rgba(23,23,26,.06)}
.d-today>span{font-weight:600}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.st{display:flex;flex-direction:column;gap:2px}
.st .num{font-size:64px;color:var(--ink)}
.st .num small{font-size:.5em;margin-left:2px}
.st-l{font-size:13px;color:var(--ink);font-weight:600;margin-top:4px}
.st-u{font-size:12.5px;color:var(--muted)}
.hm-scroll{overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.hm{display:block}
.hm .l0{fill:var(--empty)}
.hm .nd{fill:none;stroke:var(--empty);stroke-width:1}
.hm .l1{fill:color-mix(in srgb,var(--hc) 30%,transparent)}
.hm .l2{fill:color-mix(in srgb,var(--hc) 52%,transparent)}
.hm .l3{fill:color-mix(in srgb,var(--hc) 75%,transparent)}
.hm .l4{fill:var(--hc)}
.hm .tdy{stroke:var(--ink);stroke-width:1.5}
.ax{fill:var(--muted);font:11px var(--sys)}
.gl{stroke:var(--line);stroke-width:1}
.hm-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11.5px;color:var(--muted);margin-top:8px}
.hm-leg i{width:10px;height:10px;border-radius:2px;display:block}
.hm-leg .l0{background:var(--empty)}
.hm-leg .l1{background:color-mix(in srgb,var(--hc) 30%,transparent)}
.hm-leg .l2{background:color-mix(in srgb,var(--hc) 52%,transparent)}
.hm-leg .l3{background:color-mix(in srgb,var(--hc) 75%,transparent)}
.hm-leg .l4{background:var(--hc)}
.hm-leg i:first-of-type{margin-left:6px}
.hm-leg i:last-of-type{margin-right:6px}
.chart{display:block;overflow:visible}
.chart .val{fill:var(--ink);font:600 12px var(--sys)}
.chart .pt{fill:var(--bg);stroke-width:2}
.bars{display:grid;gap:12px}
.br{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;align-items:center;gap:12px;font-size:13.5px}
.br-n{display:flex;align-items:center;gap:8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-n .ic{color:var(--hc)}
.br-t{height:10px;border-radius:5px;background:var(--empty);overflow:hidden}
.br-t i{display:block;height:100%;background:var(--hc);border-radius:5px}
.br-v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.s-sum{display:flex;align-items:flex-end;gap:16px;margin-top:18px}
.s-sum .num{font-size:72px}
.s-sum .num small{font-size:.45em;margin-left:2px}
.s-sum div{padding-bottom:6px}

/* settings, forms */
.set{margin-top:22px}
.set-h{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.set-box{background:var(--surface);border-radius:16px;padding:2px 16px}
.t-light .set-box{box-shadow:0 1px 2px rgba(23,23,26,.06)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row>span{display:flex;align-items:center;gap:9px}
.set-row .sub{display:block;font-size:12.5px;color:var(--muted)}
.btns{display:flex;gap:8px}
.ok{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--accent);font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-top:16px}
.fld input,.rem input{height:44px;border-radius:12px;border:1.5px solid var(--field);background:var(--surface);padding:0 13px;font-size:15px;font-weight:400;color:var(--ink)}
.t-dark .fld input,.t-dark .rem input{background:#121117}
.fld input:focus,.rem input:focus{outline:none;border-color:var(--accent)}
.fs{border:0;padding:0;margin:18px 0 0}
.fs legend{font-size:13px;font-weight:600;padding:0;margin-bottom:8px}
.icons{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ico{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1.5px solid var(--line2)}
.ico.on{color:var(--ink);border-color:var(--ink);background:var(--empty)}
.sw{display:flex;gap:10px}
.swt{width:34px;height:34px;border-radius:50%;background:var(--hc);box-shadow:0 0 0 2px var(--bg)}
.swt.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--hc)}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;height:38px;text-align:center;border-radius:10px;border:1.5px solid var(--line2);font-weight:600;font-size:13px;color:var(--muted)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px;font-weight:600}
.fs .fs-row{margin-top:10px;font-weight:400}
.rem{display:flex;align-items:center;gap:10px}
.rem input{height:38px;width:110px}
.rem input:disabled{opacity:.4}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch.on{background:var(--grad)}
.switch.on i{left:23px}
.m-actions{display:flex;align-items:center;gap:10px;margin-top:26px}
.m-title{font-size:32px;margin:0}

/* absender */
.absender{display:flex;align-items:center;gap:16px;padding:14px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.absender a{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;flex:none}
.absender .wmk{width:76px;height:14px;background:currentColor;-webkit-mask:url(pleasance-wordmark.svg) left center/contain no-repeat;mask:url(pleasance-wordmark.svg) left center/contain no-repeat;color:var(--ink)}
.absender .band{position:relative;width:8.5rem;height:3px;margin-left:auto;border-radius:2px;background:linear-gradient(var(--veil),var(--veil)),var(--spectrum)}
.absender .marker{position:absolute;top:-3px;height:9px;border-radius:5px;background:var(--grad);box-shadow:0 0 0 2px var(--bg)}
.absender .lang{text-decoration:underline;text-underline-offset:.2em}

/* toast, banner, modal */
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:55;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap;animation:tin .2s ease-out}
.ph .toast{bottom:104px}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.notif{position:absolute;z-index:56;display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:20px;background:rgba(40,39,46,.82);backdrop-filter:blur(18px);color:#F2F0EA;font-size:13.5px;box-shadow:0 12px 34px rgba(0,0,0,.4);animation:nin .35s ease-out}
.t-light .notif{background:rgba(250,250,248,.9);color:#17171A}
.ph .notif{top:54px;left:10px;right:10px}
.app .notif{top:16px;right:16px;width:340px;border-radius:14px}
.notif b{display:block;font-size:12px;font-weight:600;opacity:.7}
.notif .nt{display:block;font-weight:600}
.notif .ntime{margin-left:auto;font-size:12px;opacity:.6}
@keyframes nin{from{opacity:0;transform:translateY(-14px)}}
.modal-bg{position:absolute;inset:0;z-index:40;background:var(--overlay);display:grid;place-items:center;padding:30px}
.modal{width:600px;max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--line2);border-radius:22px;padding:26px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}

/* ---------- Desktop shells ---------- */
.app.desk{width:100%;height:100%;display:grid;position:relative;overflow:hidden}
.app.desk.A{grid-template-columns:236px 1fr}
.side{display:flex;flex-direction:column;gap:3px;padding:22px 14px 16px;border-right:1px solid var(--line)}
.side .brand{padding:0 8px 22px}
.nav-side{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;position:relative}
.nv:hover{color:var(--ink);background:var(--empty)}
.nv.on{color:var(--ink);background:var(--empty)}
.nav-side .nv.on::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--grad)}
.main{overflow:auto;display:flex;flex-direction:column;min-height:0}
.main-in{flex:1;padding:38px 48px 36px;width:100%}
.date{font-size:60px;margin:0}
.th{position:relative}
.th-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}

/* A */
.a-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:56px;max-width:1040px}
.a-wrap .list{margin-top:26px}
.rail{padding-top:8px}
.rail-h{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;font-size:12px;color:var(--muted)}
.wk-bar{flex:1;width:100%;max-width:24px;border-radius:7px;background:var(--empty);display:flex;align-items:flex-end;overflow:hidden}
.wk-bar i{display:block;width:100%;background:color-mix(in srgb,var(--accent) 70%,transparent);border-radius:7px}
.wk-d.today{color:var(--ink);font-weight:700}
.wk-d.today .wk-bar i{background:var(--grad)}
.wk-d.fut .wk-bar{background:none;border:1.5px dashed var(--line2)}
.rail-stat{display:flex;flex-direction:column;margin-top:30px;gap:4px;font-size:13px;color:var(--muted)}
.rail-stat .big{font-size:54px;color:var(--ink)}
.rail-stat b{color:var(--ink);font-weight:600}

/* login */
.login{display:grid;place-items:center;height:100%;padding:24px}
.login-card{width:380px;display:flex;flex-direction:column}
.login-h{font-size:56px;margin:18px 0 4px}
.login-card .btn{margin-top:12px}
.login-card .btn.pri{margin-top:24px}
.hint{font-size:12.5px;color:var(--muted);margin-top:18px}
.app.desk.login-only{grid-template-rows:1fr auto}

/* ---------- Phone ---------- */
.phone{width:410px;padding:10px;border-radius:60px;background:#1a191f;box-shadow:0 0 0 1px #2c2a33,0 30px 70px rgba(0,0,0,.55)}
.ph{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ph-status{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 40px;font-weight:600;font-size:15px}
.ph-isl{width:118px;height:34px;border-radius:20px;background:#000}
.ph-sys{display:flex;gap:5px;align-items:center}
.ph-body{flex:1;overflow:auto;padding:6px 20px 28px;position:relative;scrollbar-width:none}
.ph-tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg)}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 4px;font-size:10.5px;color:var(--muted);font-weight:500;position:relative}
.tb.on{color:var(--ink)}
.tb.on::before{content:'';position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--grad)}
.ph-home{height:26px;flex:none;display:grid;place-items:center;background:var(--bg)}
.ph-home::before{content:'';width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85}
.ph .date{font-size:42px}
.ph-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:8px}
.ph .sync{padding:4px 0;margin-top:6px}
.ph .row-name{font-size:15px}
.ph .grp-h{margin-top:22px}
.ph-bar{display:flex;align-items:center;justify-content:space-between;height:44px;margin:0 -6px 6px}
.back{display:flex;align-items:center;gap:2px;color:var(--ink);font-weight:500;font-size:15px;padding:6px 4px;border-radius:9px}
.ph-bar-t{font-weight:600;font-size:15px}
.txtbtn{font-size:15px;color:var(--muted);padding:6px 8px}
.txtbtn.strong{color:var(--accent);font-weight:700}
.ph .d-name{font-size:34px;margin:0 0 4px}
.ph .d-head{gap:14px}
.ph .chip.lg{width:50px;height:50px}
.ph .st .num{font-size:46px}
.ph .card{padding:16px;border-radius:16px}
.ph .s-sum .num{font-size:60px}
.ph .br{grid-template-columns:118px 1fr 38px;gap:8px;font-size:12.5px}
.ph .absender{padding:22px 0 0;border-top:0;flex-wrap:wrap;gap:12px}
.ph .absender .band{width:6rem}
.ph .icons{grid-template-columns:repeat(5,1fr)}
.ph .login-card{width:100%}
.ph .login{place-items:start center;padding:56px 4px 0}
@media (max-width:1100px){.ws-card{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ws-card{grid-template-columns:1fr}.ws-bar{padding:10px 12px}.ws-intro,.ws-stage{padding:0 12px}.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-120px}}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
HABITS.forEach((h,k)=>{
  const r=rng((k+1)*7919),a=new Array(N).fill(0);let prev=true;
  for(let i=0;i<N-1;i++){
    if(h.rhythm==='days'&&!h.days.includes(DOW[i]))continue;
    if(h.rhythm==='weekly'){a[i]=r()<h.rate?1:0;continue}
    const p=prev?Math.min(.95,h.rate+.12):Math.max(.08,h.rate-.3),done=r()<p;prev=done;
    a[i]=done?h.target:(h.target>1?Math.floor(r()*h.target*.8):0);
  }
  if(h.rhythm==='weekly'){
    for(let w=1;w<=h.force;w++){const m=MON0-7*w;for(let d=0;d<7;d++)a[m+d]=0;[0,2,5].forEach(d=>a[m+d]=1)}

    a[MON0]=1;
  }else{
    let i=N-2,c=0;
    while(c<h.force){if(h.rhythm!=='days'||h.days.includes(DOW[i])){a[i]=h.target;c++}i--}
    while(h.rhythm==='days'&&!h.days.includes(DOW[i]))i--;
    a[i]=0;
  }
  h.hist=a;
});

const isDone=(h,i)=>countAt(h,i)>=h.target;
function weekCount(h,mon){let c=0;for(let d=0;d<7;d++){const i=mon+d;if(i>=0&&i<N&&countAt(h,i)>0)c++}return c}
function dueToday(h){if(h.rhythm==='days')return isDue(h,N-1);if(h.rhythm==='weekly')return weekCount(h,MON0)-(countAt(h,N-1)>0?1:0)<h.times;return true}
function streak(h){
  if(h.rhythm==='weekly'){let s=weekCount(h,MON0)>=h.times?1:0;for(let m=MON0-7;m>=0;m-=7){if(weekCount(h,m)>=h.times)s++;else break}return s}
  let i=N-1;if(!isDone(h,i))i--;let s=0;
  for(;i>=0;i--){if(!isDue(h,i))continue;if(isDone(h,i))s++;else break}return s}
function longest(h){
  let best=0,run=0;
  if(h.rhythm==='weekly'){for(let m=MON0%7;m<=MON0;m+=7){if(weekCount(h,m)>=h.times){run++;best=Math.max(best,run)}else if(m!==MON0)run=0}return Math.max(best,streak(h))}
  for(let i=0;i<N;i++){if(!isDue(h,i))continue;if(isDone(h,i)){run++;best=Math.max(best,run)}else if(i!==N-1)run=0}return Math.max(best,streak(h))}
function rangeStat(h,a,b){a=Math.max(0,a);b=Math.min(N-1,b);if(b<a)return{done:0,due:0};
  if(h.rhythm==='weekly'){let d=0;for(let i=a;i<=b;i++)if(countAt(h,i)>0)d++;const due=h.times*(b-a+1)/7;return{done:Math.min(d,due),due}}
  let done=0,due=0;for(let i=a;i<=b;i++){if(!isDue(h,i))continue;due++;done+=Math.min(1,countAt(h,i)/h.target)}return{done,due}}
const rate=(list,a,b)=>{let d=0,u=0;list.forEach(h=>{const r=rangeStat(h,a,b);d+=r.done;u+=r.due});return u?d/u:0};
const idxOf=d=>N-1-Math.round((TODAY-d)/864e5);
function periods(range){
  const out=[];
  if(range==='week'){for(let k=11;k>=0;k--){const a=MON0-7*k;out.push({a,b:Math.min(a+6,N-1),l:t('kw')(41-k)})}}
  else{for(let k=11;k>=0;k--){const s=new Date(2026,9-k,1),e=new Date(2026,10-k,0);out.push({a:idxOf(s),b:Math.min(idxOf(e),N-1),l:MO[S.lang][s.getMonth()]})}}
  return out}
const unitFor=(h,n)=>h.rhythm==='weekly'?t('unitW')(n):h.rhythm==='days'?t('unitX')(n):t('unitD')(n);
const streakText=h=>{const s=streak(h);return h.rhythm==='weekly'?t('streakW')(s):h.rhythm==='days'?t('streakX')(s):t('streakD')(s)};
const rhythmText=h=>h.rhythm==='weekly'?t('timesWeek')(h.times):h.rhythm==='days'?h.days.map(d=>WD[S.lang][d]).join(', '):(h.target>1?t('dailyN')(h.target):t('daily'));
function metaParts(h){const p=[rhythmText(h)];if(h.rhythm==='weekly')p.push(t('weekProg')(weekCount(h,MON0),h.times));p.push(streakText(h));return p}
function fmtDate(short){const d=TODAY;return S.lang==='de'?`${WDL.de[DOW[N-1]]}, ${d.getDate()}. ${(short?MO:MOL).de[d.getMonth()]}${short?'.':''}`:`${WDL.en[DOW[N-1]]}, ${d.getDate()} ${(short?MO:MOL).en[d.getMonth()]}`}
const active=()=>HABITS;
const dueList=()=>HABITS.filter(dueToday);
const notList=()=>HABITS.filter(h=>!dueToday(h));
function nextDue(h){for(let d=1;d<8;d++)if(h.rhythm!=='days'||h.days.includes((DOW[N-1]+d)%7))return d;return 1}

function rangeSeg(F,ctx){return `<div class="seg" role="tablist"><button role="tab" class="${F.range==='week'?'on':''}" aria-selected="${F.range==='week'}" data-act="range" data-v="week" data-testid="${ctx}.range.week">${t('weeks')}</button><button role="tab" class="${F.range==='month'?'on':''}" aria-selected="${F.range==='month'}" data-act="range" data-v="month" data-testid="${ctx}.range.month">${t('months')}</button></div>`}

/* heatmap: 53 weeks, Monday on top */
function heatmap(h,cell,gap){
  const start=MON0-52*7,top=16,left=22,step=cell+gap;let s='',months='',lastM=-1;
  for(let c=0;c<53;c++){
    const fi=start+c*7;
    if(fi>=0&&fi<N){const m=DATES[fi].getMonth();if(m!==lastM){if(lastM!==-1||c===0)months+=`<text class="ax" x="${left+c*step}" y="10">${MO[S.lang][m]}</text>`;lastM=m}}
    for(let r=0;r<7;r++){const i=start+c*7+r;if(i<0||i>N-1)continue;
      const v=countAt(h,i);let cls;
      if(!isDue(h,i)&&v===0)cls='nd';else if(v===0)cls='l0';else if(h.target>1){const q=v/h.target;cls=q>=1?'l4':q>=.6?'l3':q>=.3?'l2':'l1'}else cls='l4';
      s+=`<rect class="${cls}${i===N-1?' tdy':''}" x="${left+c*step}" y="${top+r*step}" width="${cell}" height="${cell}" rx="2"/>`}
  }
  const wl=[0,2,4].map(r=>`<text class="ax" x="0" y="${top+r*step+cell-1}">${WD[S.lang][r].slice(0,2)}</text>`).join('');
  const W=left+53*step+18,H=top+7*step;
  return `<svg class="hm" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('last12')}" style="--hc:${hc(h)}">${months}${wl}${s}</svg>`}
function legend(h){return `<div class="hm-leg" style="--hc:${hc(h)}">${t('hmLess')}<i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>${t('hmMore')}</div>`}

function lineChart(vals,labels,w,hgt,color,every){
  const pl=40,pr=16,pt=14,pb=24,iw=w-pl-pr,ih=hgt-pt-pb,n=vals.length;
  const x=k=>pl+iw*k/(n-1),y=v=>pt+ih*(1-v);let id='lc'+(uid++);
  const stroke=color?color:`url(#${id})`;
  const grid=[0,.5,1].map(v=>`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v*100)} %</text>`).join('');
  const d=vals.map((v,k)=>`${k?'L':'M'}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const xl=labels.map((l,k)=>(k%every===(n-1)%every)?`<text class="ax" x="${x(k)}" y="${hgt-6}" text-anchor="middle">${l}</text>`:'').join('');
  const last=vals[n-1];
  return `<svg class="chart" width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" role="img" aria-label="${labels[0]}–${labels[n-1]}: ${Math.round(last*100)} %"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt}">${gradStops}</linearGradient></defs>${grid}${xl}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,k)=>`<circle class="pt" cx="${x(k)}" cy="${y(v)}" r="${k===n-1?4.5:2.5}" stroke="${stroke}"/>`).join('')}<text class="val" x="${x(n-1)}" y="${y(last)-11}" text-anchor="end">${Math.round(last*100)} %</text></svg>`}

function todayA(phone){
  const due=dueList(),done=due.filter(h=>isDone(h,N-1)).length,not=notList();
  const head=phone
    ?`<div class="ph-head"><div class="pr"><h1 class="disp date">${fmtDate(true)}</h1>${pin(2)}</div>${newBtn(true)}</div>${syncBadge()}`
    :`<div class="th-row"><div class="pr"><h1 class="disp date">${fmtDate(false)}</h1>${pin(2)}</div>${newBtn(false)}</div>`;
  const prog=`<div class="prog">${t('doneOf')(done,due.length)}</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuenow="${done}" aria-valuemax="${due.length}"><i style="width:${due.length?done/due.length*100:0}%"></i></div>`;
  const list=`<div class="list">${due.map((h,k)=>rowA(h,k===0)).join('')}</div>`;
  const nd=not.length?`<div class="pr"><h2 class="grp-h">${t('notToday')}</h2>${pin(8)}</div><div class="list">${not.map(rowND).join('')}</div>`:'';
  if(phone)return head+prog+list+nd;
  return `<div class="a-wrap"><div>${head}${prog}${list}${nd}</div>${railA()}</div>`}
function railA(){
  const days=WD[S.lang].map((l,k)=>{const i=MON0+k,fut=i>N-1;const list=HABITS.filter(h=>h.rhythm!=='weekly');return{l,fut,today:i===N-1,r:fut?0:rate(list,i,i)}});
  const best=HABITS.map(h=>({h,s:streak(h)})).filter(x=>x.h.rhythm==='daily').sort((a,b)=>b.s-a.s)[0];
  return `<aside class="rail pr">${pin(9)}<h2 class="rail-h">${t('thisWeek')}</h2>
    <div class="wk" role="img" aria-label="${t('thisWeek')}">${days.map(d=>`<div class="wk-d ${d.today?'today':''} ${d.fut?'fut':''}"><div class="wk-bar"><i style="height:${d.r*100}%"></i></div><span>${d.l}</span></div>`).join('')}</div>
    <div class="rail-stat"><span class="disp big">${best.s}</span><span>${t('bestRunning')(esc(nm(best.h)))}</span></div>
    <div class="rail-stat"><span class="disp big">21:45</span><span>${t('nextRem')('21:45',esc(nm(byId('phone'))))}</span></div></aside>`}

function detail(F,id,phone){

      <div class="st"><span class="disp num" data-testid="detail.streak.longest">${lng}</span><span class="st-l">${t('longStreak')}</span><span class="st-u">${unitFor(h,lng)}</span></div>
      <div class="st"><span class="disp num">${Math.round(r*100)}<small>%</small></span><span class="st-l">${t('rate30')}</span><span class="st-u">${t('rate30u')}</span></div></div>

  const bars=HABITS.map(h=>{const s=rangeStat(h,N-30,N-1);return{h,r:s.due?s.done/s.due:0}}).sort((a,b)=>b.r-a.r);

  <button class="btn pri wide" data-act="login" data-testid="login.submit">${t('login')}</button>
  <button class="btn sec wide" data-act="login" data-testid="login.register">${t('register')}</button>
  <p class="hint">${t('offlineHint')}</p></div></div>`}

function formStepper(k,v,max){return `<div class="stepper"><button class="stp" data-act="fstep" data-k="${k}" data-v="-1" data-testid="form.${k}.dec" aria-label="${t('less')}" ${v<=1?'disabled':''}>${ic('minus',16)}</button><span class="cnt"><b>${v}</b></span><button class="stp" data-act="fstep" data-k="${k}" data-v="1" data-testid="form.${k}.inc" aria-label="${t('more')}" ${v>=max?'disabled':''}>${ic('plus',16)}</button></div>`}
function editForm(F,phone){
  const m=F.form,isNew=!m.id,title=t(isNew?'newHabit':'editHabit');const tones=S.theme==='dark'?GLOW:DEEP;
  return `<div class="form">
  ${phone?`<div class="ph-bar"><button class="txtbtn" data-act="cancel" data-testid="form.cancel">${t('cancel')}</button><span class="ph-bar-t">${title}</span><button class="txtbtn strong" data-act="save" data-testid="form.save">${t(isNew?'create':'save')}</button></div>`:`<h2 class="disp m-title">${title}</h2>`}
  <label class="fld"><span>${t('name')}</span><input data-bind="name" value="${esc(m.name)}" placeholder="${t('namePh')}" data-testid="form.name"></label>
  <fieldset class="fs"><legend>${t('symbol')}</legend><div class="icons">${ICONS.map(i=>`<button class="ico ${m.icon===i?'on':''}" data-act="fset" data-k="icon" data-v="${i}" aria-pressed="${m.icon===i}" aria-label="${i}" data-testid="form.icon.${i}">${ic(i,20)}</button>`).join('')}</div></fieldset>
  <fieldset class="fs"><legend>${t('color')}</legend><div class="sw">${tones.map((c,k)=>`<button class="swt ${m.stage===k+1?'on':''}" style="--hc:${c}" data-act="fset" data-k="stage" data-v="${k+1}" aria-pressed="${m.stage===k+1}" aria-label="${t('color')} ${k+1}" data-testid="form.color.${k+1}"></button>`).join('')}</div></fieldset>
  <fieldset class="fs"><legend>${t('rhythm')}</legend><div class="seg">${['daily','weekly','days'].map(r=>`<button class="${m.rhythm===r?'on':''}" data-act="fset" data-k="rhythm" data-v="${r}" aria-pressed="${m.rhythm===r}" data-testid="form.rhythm.${r}">${t('r_'+r)}</button>`).join('')}</div>
    ${m.rhythm==='weekly'?`<div class="fs-row"><span>${t('perWeek')}</span>${formStepper('times',m.times,6)}</div>`:''}
    ${m.rhythm==='days'?`<div class="days">${WD[S.lang].map((d,k)=>`<button class="day ${m.days.includes(k)?'on':''}" data-act="fday" data-v="${k}" aria-pressed="${m.days.includes(k)}" data-testid="form.day.${k}">${d.slice(0,2)}</button>`).join('')}</div>`:''}</fieldset>
  <div class="fs-row"><span>${t('perDay')}</span>${formStepper('target',m.target,20)}</div>
  <div class="fs-row"><span>${t('reminder')}</span><div class="rem"><button class="switch ${m.remind?'on':''}" role="switch" aria-checked="${m.remind}" aria-label="${t('reminder')}" data-act="fset" data-k="remind" data-v="${!m.remind}" data-testid="form.reminder.toggle"><i></i></button><input type="time" value="${m.time}" ${m.remind?'':'disabled'} data-bind="time" data-testid="form.reminder.time"></div></div>
  ${phone?(isNew?'':`<button class="btn ghost danger wide" style="margin-top:28px" data-act="archive" data-testid="form.archive">${ic('archive',16)}${t('archiveBtn')}</button>`)
   :`<div class="m-actions">${isNew?'':`<button class="btn ghost danger" data-act="archive" data-testid="form.archive">${ic('archive',16)}${t('archiveBtn')}</button>`}<span class="spacer"></span><button class="btn sec" data-act="cancel" data-testid="form.cancel">${t('cancel')}</button><button class="btn pri" data-act="save" data-testid="form.save">${t(isNew?'create':'save')}</button></div>`}</div>`}

const toastEl=F=>F.toast?`<div class="toast" role="status">${F.toast}</div>`:'';
const banner=()=>S.banner?`<div class="notif" role="status">${sign(38)}<div><b>Takt</b><span class="nt">${esc(nm(byId('water')))}</span><span>${t('notifBody')}</span></div><span class="ntime">${t('now')}</span></div>`:'';

function screenContent(F,phone){
  switch(F.screen){
    case 'today':return todayA(phone);
    case 'detail':return detail(F,F.habit,phone);
    case 'stats':return stats(F,phone);
    case 'habits':return habitsScreen(phone);
    case 'settings':return settings(phone);
  }return ''}
function desktop(f){
  const F=S.frames[f];
  if(F.screen==='login')return `<div class="app desk login-only">${login()}${absender()}</div>`;
  let modal='';
  if(F.modal==='edit')modal=`<div class="modal-bg" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true">${editForm(F,false)}</div></div>`;
  const main=`<main class="main"><div class="main-in">${screenContent(F,false)}</div>${absender()}</main>`;
  const extra=modal+toastEl(F)+banner();
  return `<div class="app desk A"><aside class="side">${brand()}${navList(F,'side')}<div class="spacer"></div>${syncBadge()}</aside>${main}${extra}</div>`}
function phone(f){
  const F=S.frames[f];
  const status=`<div class="ph-status"><span>9:41</span><span class="ph-isl"></span><span class="ph-sys">${ic('signal',15)}${ic('wifi',15)}${ic('batt',22)}</span></div>`;
  const extra=toastEl(F)+(f===1?banner():'');
  if(F.screen==='login')return `${status}<div class="ph-body">${login()}</div><div class="ph-home"></div>${extra}`;
  if(F.screen==='edit')return `${status}<div class="ph-body">${editForm(F,true)}</div><div class="ph-home"></div>${extra}`;
  return `${status}<div class="ph-body">${screenContent(F,true)}</div>${tabs(F)}<div class="ph-home"></div>${extra}`}

/* ---------- workshop intro ---------- */
const NOTES=[
 'Brand: Pleasance family, colour band stage 3, section 3.00 to 3.60. Gradient at 45° from bottom left to top right: #F2C14E, #CAC561, #A2C974. Text on the gradient is always #17171A. It goes only where the user acts: main button, active navigation line, progress. “Takt” and the sign (check mark with dot) are working titles.',
 'Bricolage Grotesque (this folder, OFL) only for the date, titles and large numbers, at width 78 % and weight 780. Everything else uses the platform’s system font. If a stack cannot use the width axis, a static instance at 78 % and 780 is allowed.',
 'A habit’s colour is one of the 7 band stages: GLOW tones in dark mode, DEEP tones in light mode (see the source). The API and the export store the number 1 to 7.',
 'Test IDs belong to functions, not to layout. Every client exposes exactly these IDs as accessibility identifiers, so one E2E suite drives every stack. Switch on “Test IDs” and hover an element to see them.',
 'The heatmap and the charts are drawn by the client, no library is prescribed. Discipline 7 measures them with 20,000 entries.',
 'The sync status is always visible. Switch on “Offline”: checking off keeps working, changes wait locally.',
 'Each habit is a plain list row: a check button for once a day, a stepper for several times a day. Every stack has native building blocks for this.',
 '“Not due today” collects habits with fixed weekdays. “x times a week” stays due until the week is full.',
 'Desktop: sidebar navigation and a right rail with the week, the longest running streak and the next reminder. Phone: 4 tabs at the bottom.'];
function renderIntro(){
  document.getElementById('intro').innerHTML=`<div class="ws-card"><div><h1>Direction A: list<span class="rec">Approved</span></h1><p>A calm list for the day. Habits done once a day are checked off with one tap, habits done several times a day get a stepper. Details and statistics have their own pages.</p></div>
  <div><h4>Screens</h4><ul><li>Today</li><li>Habit details</li><li>Statistics</li><li>Habits and archive</li><li>Settings</li><li>Sign in</li><li>Create and edit a habit</li></ul></div>
  <div><h4>Sample data</h4><ul><li>Today is Tuesday, 6 October 2026</li><li>7 habits, 1 archived</li><li>12 months of history</li></ul></div>
  <div><h4>Notes</h4><ol class="ws-notes">${NOTES.map((n,k)=>`<li>${pin(k+1)}<span>${n}</span></li>`).join('')}</ol></div></div>`}

/* ---------- render ---------- */
const stage=document.getElementById('stage');
function fit(){const w=document.querySelector('.desk-wrap');if(!w)return;const s=Math.min(1,w.clientWidth/1284);w.querySelector('.scaler').style.transform=`scale(${s})`;w.style.height=(804*s)+'px'}
function render(){
  const keep={};
  stage.querySelectorAll('[data-f]').forEach(fr=>{const f=fr.dataset.f;keep[f]={screen:S.frames[f].screen+(S.frames[f].modal||''),s:[...fr.querySelectorAll('.main,.ph-body,.modal')].map(e=>e.scrollTop)}});
  document.body.classList.toggle('no-pins',!S.notes);document.body.classList.toggle('tids',S.tids);
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-ws]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',S[g.dataset.ws]===b.dataset.v)));
  renderIntro();
  const th=S.theme==='dark'?'t-dark':'t-light';
  if(S.device==='desktop'){stage.innerHTML=`<div class="desk-wrap"><div class="scaler"><div class="frame ${th}" data-f="0">${desktop(0)}</div></div></div>`;fit()}
  else{const caps=['','Starts on Today','Starts on the details','Starts on Statistics'];stage.innerHTML=`<div class="phones">${[1,2,3].map(f=>`<div class="phone-wrap"><div class="phone"><div class="ph ${th}" data-f="${f}">${phone(f)}</div></div><div class="phone-cap">${caps[f]}</div></div>`).join('')}</div>`}
  stage.querySelectorAll('[data-f]').forEach(fr=>{const f=fr.dataset.f,k=keep[f];
    fr.querySelectorAll('.hm-scroll').forEach(e=>e.scrollLeft=e.scrollWidth);
    if(k&&k.screen===S.frames[f].screen+(S.frames[f].modal||''))[...fr.querySelectorAll('.main,.ph-body,.modal')].forEach((e,i)=>{if(k.s[i]!=null)e.scrollTop=k.s[i]})});
}
window.addEventListener('resize',fit);
new URLSearchParams(location.search).forEach((v,k)=>{if(k in S&&typeof S[k]==='string')S[k]=v;else if(k==='screen')S.frames.forEach(F=>F.screen=v)});

function toast(F,msg){F.toast=msg;render();clearTimeout(F._tt);F._tt=setTimeout(()=>{F.toast=null;render()},2200)}
function newForm(){return{id:null,name:'',icon:'drop',stage:3,rhythm:'daily',times:3,days:[0,2,4],target:1,remind:true,time:'09:00'}}
function formFrom(h){return{id:h.id,name:nm(h),icon:h.icon,stage:h.stage,rhythm:h.rhythm,times:h.times||3,days:(h.days||[0,2,4]).slice(),target:h.target,remind:!!h.reminder,time:h.reminder||'09:00'}}
function changeCount(id,d){const h=byId(id);const c=S.counts[id]||0;const n=Math.max(0,Math.min(h.target*(h.target>1?1.5:1),c+d));if(n===c)return;S.counts[id]=Math.round(n);if(S.offline)S.pending++;S.bump=id}
const isPhoneFrame=f=>f>0;
function act(a,el,f){
  const F=S.frames[f],ph=isPhoneFrame(f),id=el.dataset.id;
  switch(a){
    case 'nav':F.screen=el.dataset.to;F.modal=null;break;
    case 'detail':F.screen='detail';F.habit=id;break;
    case 'back':F.screen='today';break;
    case 'inc':changeCount(id,1);break;
    case 'dec':changeCount(id,-1);break;
    case 'toggle':{const h=byId(id);changeCount(id,(S.counts[id]||0)>=h.target?-(S.counts[id]):1);break}
    case 'range':F.range=el.dataset.v;break;
    case 'new':F.form=newForm();if(ph)F.screen='edit';else F.modal='edit';break;
    case 'edit':F.form=formFrom(byId(id));if(ph){F.back=F.screen;F.screen='edit'}else F.modal='edit';break;
    case 'fset':{const k=el.dataset.k;let v=el.dataset.v;if(k==='stage')v=+v;if(k==='remind')v=v==='true';F.form[k]=v;break}
    case 'fstep':{const k=el.dataset.k;F.form[k]=Math.max(1,F.form[k]+(+el.dataset.v));break}
    case 'fday':{const k=+el.dataset.v,ds=F.form.days;F.form.days=ds.includes(k)?ds.filter(x=>x!==k):[...ds,k].sort();break}
    case 'cancel':closeForm(F,ph);break;
    case 'save':{const m=F.form;if(!m.name.trim()){const inp=el.closest('[data-f]').querySelector('[data-testid="form.name"]');inp&&inp.focus();return}
      let h;if(m.id){h=byId(m.id)}else{h={id:'h'+Date.now(),name:{},hist:new Array(N).fill(0)};HABITS.push(h);S.counts[h.id]=0}
      Object.assign(h,{name:{de:m.name,en:m.name},icon:m.icon,stage:m.stage,rhythm:m.rhythm,times:m.times,days:m.days.slice(),target:m.target,reminder:m.remind?m.time:null});
      if(S.offline)S.pending++;closeForm(F,ph);toast(F,S.offline?t('savedOff'):t(m.id?'saved':'created'));return}
    case 'archive':{const i=HABITS.findIndex(h=>h.id===F.form.id);if(i>=0)ARCHIVED.push(...HABITS.splice(i,1));F.modal=null;F.screen=ph?'habits':(F.screen==='detail'?'today':F.screen);toast(F,t('archived'));return}
    case 'restore':{const i=ARCHIVED.findIndex(h=>h.id===id);if(i>=0){const h=ARCHIVED.splice(i,1)[0];HABITS.push(h);if(S.counts[h.id]==null)S.counts[h.id]=0}toast(F,t('restored'));return}
    case 'syncnow':if(S.offline){toast(F,t('offline')(S.pending));return}toast(F,t('syncedNow'));return;
    case 'file':toast(F,t('fileDlg'));return;
    case 'logout':F.screen='login';F.modal=null;break;
    case 'login':F.screen='today';break;
    case 'lang':S.lang=S.lang==='de'?'en':'de';break;
    case 'setlang':S.lang=el.dataset.v;break;
  }
  render();S.bump=null}
function closeForm(F,ph){if(ph){F.screen=F.back&&F.back!=='edit'?F.back:'habits';F.back=null}F.modal=null;F.form=null;render()}

document.addEventListener('click',e=>{
  const bd=e.target.closest('[data-backdrop]');if(bd&&e.target===bd){const f=+bd.closest('[data-f]').dataset.f;const F=S.frames[f];F.modal=null;F.form=null;render();return}
  const ws=e.target.closest('[data-ws] button');if(ws){S[ws.closest('[data-ws]').dataset.ws]=ws.dataset.v;render();return}
  if(e.target.closest('[data-ws-act="banner"]')){S.banner=true;render();clearTimeout(S._bt);S._bt=setTimeout(()=>{S.banner=false;render()},4500);return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fr=el.closest('[data-f]');if(!fr)return;e.preventDefault();act(el.dataset.act,el,+fr.dataset.f)});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(!b)return;const F=S.frames[+e.target.closest('[data-f]').dataset.f];if(F.form)F.form[b]=e.target.value});
document.addEventListener('change',e=>{const k=e.target.dataset.wt;if(!k)return;S[k]=e.target.checked;if(k==='offline')S.pending=e.target.checked?3:0;render()});
render();
</script>
</body>
